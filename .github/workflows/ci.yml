name: MediaVault CI

on:
  push:
    branches: ['**']
  pull_request:

# Una sola corrida por rama: un push nuevo cancela el anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Compuerta 1 — Linters
  # ---------------------------------------------------------------------------
  lint:
    name: linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ---------------------------------------------------------------------------
  # Compuerta 2 — TypeScript
  # ---------------------------------------------------------------------------
  typecheck:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Compuerta 3 - Pruebas de unidad
  # ---------------------------------------------------------------------------
  # Tres piezas cuyo fallo no se ve venir:
  #
  #   Hard Rule - un error de frontera no rompe nada visible: repite contenido
  #               antes de tiempo, y eso solo se nota cuando el publico ya se canso.
  #   Cifrado   - comprueba sobre todo que se DETECTE manipulacion del texto
  #               cifrado, que es lo que distingue AES-GCM de un modo sin autenticar.
  #   Limite    - sobre el conteo de clics se reparte dinero.
  hard-rule:
    name: unidad (hard-rule, cifrado, limite de tasa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # Compuerta 4 — Politicas RLS contra un PostgreSQL real
  # ---------------------------------------------------------------------------
  # La compuerta mas importante del proyecto. Levanta una base, aplica todas las
  # migraciones e INTENTA activamente leer y escribir datos de otro inquilino.
  # Un RLS mal escrito filtra el material privado de una modelo a otra agencia, y
  # ese fallo no tiene vuelta atras.
  rls:
    name: aislamiento RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Ejecutar pruebas de RLS
        env:
          RLS_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: node scripts/run-rls-tests.mjs

  # ---------------------------------------------------------------------------
  # Compuerta 5 — Build de produccion
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Compilar
        # Valores de marcador: el build no se conecta a nada, solo necesita que
        # las variables publicas existan y tengan forma valida.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-anonima-de-marcador-para-el-build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Compuerta 6 — Workers de Python
  # ---------------------------------------------------------------------------
  workers:
    name: workers python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis
        run: python -m compileall -q workers
      - name: Verificar la barrera anti-doxxing
        # Fabrica una foto con GPS, la sanitiza y exige que no quede ni un campo.
        # Es la barrera que evita publicar el domicilio de una modelo.
        run: |
          pip install --quiet Pillow piexif
          python workers/verificar_sanitizacion.py

  # ---------------------------------------------------------------------------
  # Compuerta 7 - Imagenes de contenedor
  # ---------------------------------------------------------------------------
  # El despliegue es un VPS propio con contenedores, asi que un Dockerfile roto
  # no se descubre al hacer merge sino al intentar desplegar. Aqui se construyen
  # las dos imagenes de verdad; no se publican, solo se comprueba que compilan.
  docker:
    name: imagenes docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen del panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir la imagen de los workers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./workers/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar docker-compose
        run: docker compose config --quiet
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: marcador
          SUPABASE_SERVICE_ROLE_KEY: marcador
          DATABASE_URL: postgresql://marcador
          R2_ENDPOINT: http://placeholder.invalid
          R2_BUCKET: marcador
          R2_ACCESS_KEY_ID: marcador
          R2_SECRET_ACCESS_KEY: marcador
          UPLOAD_LINK_SECRET: marcador
          ENCRYPTION_MASTER_KEY: marcador
          CLICK_IP_SALT: marcador
          NEXT_PUBLIC_APP_URL: http://placeholder.invalid

  # ---------------------------------------------------------------------------
  # Agregador: es la unica comprobacion que hay que exigir en la rama principal.
  # ---------------------------------------------------------------------------
  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, hard-rule, rls, build, workers, docker]
    if: always()
    steps:
      - name: Verificar que todas las compuertas pasaron
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Alguna compuerta fallo."
            exit 1
          fi
          echo "Las 7 compuertas pasaron."
